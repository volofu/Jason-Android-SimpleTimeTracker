name: Build
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build
        run: ./gradlew assemblePlayDebug

      - name: Domain unit tests
        # Does not block the APK.
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :domain:test --console=plain 2>&1 | grep -E "Test.* FAILED|AssertionError|ComparisonFailure|Exception:|expected:|tests completed" | head -60

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          path: app/build/outputs/apk/play/debug/*.apk
